services:
  # PostgreSQL Database
  # entrypoint restores role LOGIN before every start (self-heal for NOLOGIN).
  db:
    image: postgres:16-alpine
    container_name: shastudio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: shastudio
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/db/entrypoint.sh:/ensure-db-entrypoint.sh:ro
    entrypoint: ["sh", "/ensure-db-entrypoint.sh"]
    command: ["postgres"]
    healthcheck:
      # Real login check — pg_isready alone stays green even when LOGIN is disabled
      test: ["CMD-SHELL", "psql -U postgres -d shastudio -c 'SELECT 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shastudio-backend
    restart: unless-stopped
    environment:
      # Always use Docker DNS host `db` (ignore local DATABASE_URL from .env — that is for host-side prisma/dev).
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shastudio?schema=public
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shastudio.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD_FORCE: ${ADMIN_PASSWORD_FORCE:-false}
      VSELLM_API_KEY: ${VSELLM_API_KEY}
      VSELLM_BASE_URL: ${VSELLM_BASE_URL}
      VSELLM_MODEL: ${VSELLM_MODEL}
    # На проде достаточно доступа из Docker-сети; порт на хост — для отладки
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy || npx prisma db push; npm run dev"

  # Frontend Next.js (внутри контейнера порт 3000)
  # Note: no source bind-mount on Windows — Next.js exits under Docker Desktop bind mounts.
  # Rebuild image after frontend changes, or run `npm run dev` locally on port 3010.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shastudio-frontend
    restart: unless-stopped
    environment:
      # Браузер ходит на тот же домен; Nginx проксирует /api → backend
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://shastudio.ru}
      NEXT_PUBLIC_VSELLM_API_KEY: ${NEXT_PUBLIC_VSELLM_API_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://shastudio.ru}
    ports:
      - "3010:3000"
    depends_on:
      - backend

  # Nginx reverse proxy + SSL (Timeweb certs)
  nginx:
    image: nginx:alpine
    container_name: shastudio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx_certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  backend_uploads:
  nginx_certbot_www:
