services:
  # PostgreSQL Database
  # App connects as role "shastudio" (not "postgres") so host hardening of
  # postgres NOLOGIN does not take the site down. Entrypoint restores LOGIN
  # on every db start; db-guard restarts db if app login fails.
  db:
    image: postgres:16-alpine
    container_name: shastudio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: shastudio
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-shastudio}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/db/entrypoint.sh:/ensure-db-entrypoint.sh:ro
      - ./deploy/db/ensure-roles.sh:/ensure-roles.sh:ro
    entrypoint: ["sh", "/ensure-db-entrypoint.sh"]
    command: ["postgres"]
    healthcheck:
      # App role (backend user). Compose $$ → container $
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$$POSTGRES_APP_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_APP_USER\" -d shastudio -c 'SELECT 1' >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # Restarts unhealthy containers (esp. db) so entrypoint can re-apply LOGIN
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: shastudio-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 20
      AUTOHEAL_START_PERIOD: 40
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # If app role cannot login, restart only db (entrypoint restores LOGIN)
  db-guard:
    image: docker:27-cli
    container_name: shastudio-db-guard
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-shastudio}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      POSTGRES_DB: shastudio
      DB_GUARD_INTERVAL_SEC: 45
      DB_GUARD_FAILS_BEFORE_RESTART: 2
      DB_CONTAINER: shastudio-db
    volumes:
      - ./deploy/db/guard.sh:/guard.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "/guard.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shastudio-backend
    restart: unless-stopped
    environment:
      # Dedicated app role — survives "ALTER ROLE postgres NOLOGIN" hardening
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-shastudio}:${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}@db:5432/shastudio?schema=public
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shastudio.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD_FORCE: ${ADMIN_PASSWORD_FORCE:-false}
      VSELLM_API_KEY: ${VSELLM_API_KEY}
      VSELLM_BASE_URL: ${VSELLM_BASE_URL}
      VSELLM_MODEL: ${VSELLM_MODEL}
    # На проде достаточно доступа из Docker-сети; порт на хост — для отладки
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy || npx prisma db push; npm run dev"

  # Frontend Next.js (внутри контейнера порт 3000)
  # Note: no source bind-mount on Windows — Next.js exits under Docker Desktop bind mounts.
  # Rebuild image after frontend changes, or run `npm run dev` locally on port 3010.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shastudio-frontend
    restart: unless-stopped
    environment:
      # Браузер ходит на тот же домен; Nginx проксирует /api → backend
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://shastudio.ru}
      NEXT_PUBLIC_VSELLM_API_KEY: ${NEXT_PUBLIC_VSELLM_API_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://shastudio.ru}
    ports:
      - "3010:3000"
    depends_on:
      - backend

  # Nginx reverse proxy + SSL (Timeweb certs)
  nginx:
    image: nginx:alpine
    container_name: shastudio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx_certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  backend_uploads:
  nginx_certbot_www:
