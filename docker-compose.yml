services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shastudio-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/shastudio.db
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shastudio.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD_FORCE: ${ADMIN_PASSWORD_FORCE:-false}
      VSELLM_API_KEY: ${VSELLM_API_KEY}
      VSELLM_BASE_URL: ${VSELLM_BASE_URL}
      VSELLM_MODEL: ${VSELLM_MODEL}
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    command: sh -c "npx prisma migrate deploy || npx prisma db push; npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shastudio-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://shastudio.ru}
      NEXT_PUBLIC_VSELLM_API_KEY: ${NEXT_PUBLIC_VSELLM_API_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://shastudio.ru}
    ports:
      - "3010:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: shastudio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx_certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

volumes:
  backend_node_modules:
  backend_uploads:
  backend_data:
  nginx_certbot_www:
