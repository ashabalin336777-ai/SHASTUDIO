      - backend_uploads:/app/uploads

  frontend:
    build:
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://shastudio.ru}
    ports: []
